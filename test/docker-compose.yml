version: '3.4'

volumes:
  zkdata:
    driver: local
  kafkadata:
    driver: local

services:
  zookeeper:
    container_name: zookeeper
    hostname: zookeeper
    image: zookeeper:3.4
    ports:
    - 2181:2181
    volumes:
    - zkdata:/data
    environment:
    - TZ=America/New_York
    - ZOO_MY_ID=1
    - ZOO_SERVERS=server.1=zookeeper:2888:3888
    healthcheck:
      test: echo stat | nc zookeeper 2181
      interval: 30s
      timeout: 30s
      retries: 3

  kafka:
    container_name: kafka
    hostname: kafka
    image: wurstmeister/kafka
    depends_on:
    - zookeeper
    ports:
    - 9092:9092
    volumes:
    - kafkadata:/kafka
    environment:
    - TZ=America/New_York
    - KAFKA_BROKER_ID=1
    - KAFKA_ADVERTISED_HOST_NAME=docker.for.mac.localhost
    - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181/kafka
    - KAFKA_NUM_PARTITIONS=4
    - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    - KAFKA_DEFAULT_REPLICATION_FACTOR=1
    - KAFKA_MIN_INSYNC_REPLICAS=1
    - KAFKA_MESSAGE_MAX_BYTES=5242880
    - KAFKA_MAX_REQUEST_SIZE=5242880
    - KAFKA_REPLICA_FETCH_MAX_BYTES=10485760
    - KAFKA_FETCH_MESSAGE_MAX_BYTES=10485760
    - KAFKA_COMPRESSION_TYPE=producer
    - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
    - KAFKA_DELETE_TOPIC_ENABLE=true
    - KAFKA_CONTROLLED_SHUTDOWN_ENABLE=true
    - JMX_PORT=9999
    - KAFKA_JMX_OPTS=-Dcom.sun.management.jmxremote -Dcom.sun.management.jmxremote.authenticate=false -Dcom.sun.management.jmxremote.ssl=false -Djava.rmi.server.hostname=kafka -Dcom.sun.management.jmxremote.rmi.port=9999
    - KAFKA_CREATE_TOPICS=OpenNMS.Nodes:1:1,OpenNMS.Alarms:1:1,OpenNMS.Alarm.Feedback:1:1,OpenNMS.Topology.Vertices:1:1,OpenNMS.Topology.Edges:1:1
    healthcheck:
      test: JMX_PORT="" kafka-topics.sh --zookeeper zookeeper:2181/kafka --list 2>&1 | grep OpenNMS
      interval: 30s
      timeout: 30s
      retries: 3

  kafka-manager:
    container_name: kafka-manager
    hostname: kafka-manager
    image: hlebalbau/kafka-manager:stable
    depends_on:
    - kafka
    ports:
    - 9000:9000
    environment:
    - TZ=America/New_York
    - ZK_HOSTS=zookeeper:2181
    healthcheck:
      test: wget --quiet --tries=1 --spider http://kafka-manager:9000 || exit 1
      interval: 30s
      timeout: 30s
      retries: 3
